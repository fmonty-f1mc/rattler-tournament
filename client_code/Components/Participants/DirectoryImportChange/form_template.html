<anvil-form container="ColumnPanel">
  <div class="directory-preview-row">
    <anvil-component type="Label" name="name_label" bind:text="self.item['name']"></anvil-component>
    <anvil-component type="Label" name="field_label" bind:text="self.item['field']"></anvil-component>
    <anvil-component type="Label" name="before_label" prop:role="muted-text" bind:text="self.item['before']"></anvil-component>
    <anvil-component type="Label" name="after_label" bind:text="self.item['after']"></anvil-component>
  </div>
</anvil-form>
