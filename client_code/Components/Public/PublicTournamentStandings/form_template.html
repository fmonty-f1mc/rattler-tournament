<anvil-form container="ColumnPanel">
  <section class="public-tournament-card">
    <anvil-component type="FlowPanel" name="public_tab_nav" prop:role="tournament-subnav">
      <anvil-component type="Button" name="round_one_tab_button" prop:text="Round One" prop:role="tournament-subtab"></anvil-component>
      <anvil-component type="Button" name="standings_tab_button" prop:text="Standings" prop:role="tournament-subtab"></anvil-component>
      <anvil-component type="Button" name="pairs_tab_button" prop:text="Pairs" prop:role="tournament-subtab"></anvil-component>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="round_one_tab">
      <section class="public-leaderboard-section">
        <div class="section-heading">
          <div><p class="eyebrow">FIRST ROUND</p><h3>Round One</h3></div>
        </div>
        <anvil-component type="RepeatingPanel" name="round_one_group_rows" prop:item_template="rattler_tournament.Components.Public.PublicRoundOneGroup" prop:role="public-round-one-group-list"></anvil-component>
        <anvil-component type="Label" name="no_round_one_groups_state" prop:role="muted-text" prop:text="Round One groups have not been posted yet."></anvil-component>
      </section>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="standings_tab">
      <section class="public-leaderboard-section">
        <div class="section-heading">
          <div><p class="eyebrow">LEADERBOARD</p><h3>Standings</h3></div>
          <div class="field-block">
            <anvil-component type="Label" name="scope_label" prop:text="View" prop:role="public-field-label"></anvil-component>
            <anvil-component type="DropDown" name="standings_scope_picker"></anvil-component>
          </div>
          <div class="field-block">
            <label>Sort by</label>
            <anvil-component type="DropDown" name="standings_sort_by"></anvil-component>
          </div>
        </div>
        <p class="muted-copy">Rattler Score = Net + Round 2 score; shown when both scores are recorded.</p>
        <div class="standing-header"><span>Place</span><span>Player</span><span>Division</span><span>Gross</span><span>Net</span><span>Rattler Score</span></div>
        <anvil-component type="RepeatingPanel" name="standings_rows" prop:item_template="rattler_tournament.Components.Public.PublicStandingRow" prop:role="standing-list"></anvil-component>
        <anvil-component type="Label" name="no_scores_state" prop:role="muted-text"></anvil-component>
      </section>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="pairs_tab">
      <section class="public-leaderboard-section">
        <div class="section-heading">
          <div><p class="eyebrow">SECOND ROUND</p><h3>Pairs</h3></div>
        </div>
        <anvil-component type="RepeatingPanel" name="round_two_pair_rows" prop:item_template="rattler_tournament.Components.Public.PublicRoundTwoPair" prop:role="public-round-two-pair-list"></anvil-component>
        <anvil-component type="Label" name="no_round_two_pairs_state" prop:role="muted-text" prop:text="Second round pairs have not been posted yet."></anvil-component>
      </section>
    </anvil-component>
  </section>
</anvil-form>
