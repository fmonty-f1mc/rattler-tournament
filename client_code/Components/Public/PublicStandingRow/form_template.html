<anvil-form container="ColumnPanel">
  <div class="standing-row">
    <anvil-component type="Label" name="rank_label" prop:role="row-title" bind:text="self.item['rank']"></anvil-component>
    <div class="public-standing-player"><anvil-component type="Label" name="player_label" prop:role="public-player-text" bind:text="self.item['player_name']"></anvil-component><sup class="public-award-superscript"><anvil-component type="Label" name="award_markers" prop:role="public-award-markers" bind:text="self.item['award_markers']" bind:visible="bool(self.item['award_markers'])"></anvil-component></sup></div>
    <anvil-component type="Label" name="division_label" prop:role="muted-text" bind:text="self.item['division']"></anvil-component>
    <anvil-component type="Label" name="gross_label" bind:text="self.item['gross']"></anvil-component>
    <anvil-component type="Label" name="net_label" prop:role="row-title" bind:text="self.item['net']"></anvil-component>
    <anvil-component type="Label" name="rattler_label" prop:role="row-title" bind:text="'—' if self.item['rattler'] is None else '{:g}'.format(self.item['rattler'])"></anvil-component>
  </div>
</anvil-form>
