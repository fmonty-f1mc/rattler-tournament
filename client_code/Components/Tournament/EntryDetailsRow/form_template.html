<anvil-form container="ColumnPanel">
  <div class="entry-details-row field-inline-row">
    <div class="field-player">
      <div class="entry-player-copy">
        <div class="entry-player-heading">
          <anvil-component type="CheckBox" name="select_player_checkbox" writeback:checked="self.item['selected']"></anvil-component>
          <anvil-component type="Label" name="player_label" prop:role="row-title" bind:text="self.item['entry']['golfer']['name']"></anvil-component>
        </div>
        <anvil-component type="Label" name="player_handicap_label" prop:role="muted-text" bind:text="'Player handicap: ' + (str(self.item['entry']['golfer']['handicap']) if self.item['entry']['golfer']['handicap'] is not None else 'Not set')"></anvil-component>
        <anvil-component type="Label" name="entry_details_summary" prop:role="muted-text"></anvil-component>
      </div>
    </div>
    <anvil-component type="ColumnPanel" name="entry_edit_fields" prop:role="field-inline-inputs">
      <div class="entry-editor-grid">
        <div class="score-input-block">
          <label>Division (optional)</label>
          <anvil-component type="DropDown" name="division_dropdown" writeback:selected_value="self.item['division']"></anvil-component>
        </div>
        <div class="score-input-block">
          <label>Rattlercap</label>
          <anvil-component type="TextBox" name="handicap_box" prop:placeholder="e.g. 12.4" writeback:text="self.item['handicap']"></anvil-component>
        </div>
      </div>
    </anvil-component>
  </div>
</anvil-form>
