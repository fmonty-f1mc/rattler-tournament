<anvil-form container="ColumnPanel">
  <div class="budget-row">
    <div class="budget-player">
      <anvil-component type="Label" name="player_label" bind:text="self.item['entry']['golfer']['name']" prop:role="row-title"></anvil-component>
      <anvil-component type="Label" name="division_label" bind:text="self.item['entry']['division']" prop:role="muted-text"></anvil-component>
      <anvil-component type="Label" name="share_total" prop:role="muted-text"></anvil-component>
      <div class="budget-category-grid">
        <anvil-component type="CheckBox" name="accommodation_check" prop:text="Accommodation"></anvil-component>
        <anvil-component type="CheckBox" name="golf_check" prop:text="Golf"></anvil-component>
        <anvil-component type="CheckBox" name="travel_check" prop:text="Travel"></anvil-component>
        <anvil-component type="CheckBox" name="other_check" prop:text="Other"></anvil-component>
      </div>
    </div>
    <div class="budget-payment">
      <label>Amount paid $<anvil-component type="TextBox" name="paid_box" prop:placeholder="0"></anvil-component></label>
      <anvil-component type="Button" name="save_button" prop:text="Save player shares" prop:role="secondary-button"></anvil-component>
    </div>
  </div>
</anvil-form>
