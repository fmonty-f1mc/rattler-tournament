<anvil-form container="ColumnPanel">
  <div class="budget-row">
    <div class="budget-player">
      <div class="budget-player-name">
        <anvil-component type="CheckBox" name="payment_selection_checkbox" prop:text="Select"></anvil-component>
        <anvil-component type="Label" name="player_label" prop:role="row-title" bind:text="self.item['entry']['golfer']['name']"></anvil-component>
      </div>
      <anvil-component type="Label" name="division_label" prop:role="muted-text" bind:text="self.item['participant_label']"></anvil-component>
      <div class="budget-expense-details">
        <anvil-component type="Label" name="amount_owed_label" prop:role="accent-text"></anvil-component>
        <anvil-component type="Label" name="no_expenses_label" prop:role="muted-text" prop:text="No expenses assigned."></anvil-component>
        <anvil-component type="RepeatingPanel" name="expense_rows" prop:item_template="rattler_tournament.ExpenseDetailRow" prop:role="budget-expense-detail-list"></anvil-component>
      </div>
    </div>
    <div class="budget-payment">
      <label>Amount paid $<anvil-component type="TextBox" name="paid_box" prop:placeholder="0"></anvil-component></label>
    </div>
  </div>
</anvil-form>
