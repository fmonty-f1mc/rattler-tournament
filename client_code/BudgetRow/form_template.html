<anvil-form container="ColumnPanel">
  <div class="budget-row">
    <div class="budget-player">
      <anvil-component type="Label" name="player_label" bind:text="self.item['golfer']['name']" prop:role="row-title"></anvil-component>
      <anvil-component type="Label" name="division_label" bind:text="self.item['division']" prop:role="muted-text"></anvil-component>
      <anvil-component type="CheckBox" name="accommodation_check" prop:text="Staying overnight"></anvil-component>
    </div>
    <div class="budget-input-grid">
      <label>Accommodation $<anvil-component type="TextBox" name="lodging_box" prop:placeholder="0"></anvil-component></label>
      <label>Golf $<anvil-component type="TextBox" name="golf_box" prop:placeholder="0"></anvil-component></label>
      <label>Travel $<anvil-component type="TextBox" name="travel_box" prop:placeholder="0"></anvil-component></label>
      <label>Other $<anvil-component type="TextBox" name="other_box" prop:placeholder="0"></anvil-component></label>
      <label>Paid $<anvil-component type="TextBox" name="paid_box" prop:placeholder="0"></anvil-component></label>
    </div>
    <anvil-component type="Button" name="save_button" prop:text="Save costs" prop:role="secondary-button"></anvil-component>
  </div>
</anvil-form>
