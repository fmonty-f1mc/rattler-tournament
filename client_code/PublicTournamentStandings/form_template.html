<anvil-form container="ColumnPanel">
  <section class="public-tournament-card">
    <div class="public-tournament-heading">
      <p class="eyebrow">TOURNAMENT</p>
      <anvil-component type="Label" name="tournament_title" prop:role="h2"></anvil-component>
    </div>
    <section class="public-leaderboard-section">
      <div class="section-heading">
        <div><p class="eyebrow">LEADERBOARD</p><h3>Standings</h3></div>
        <div class="field-block">
          <anvil-component type="Label" name="scope_label" prop:text="View" prop:role="public-field-label"></anvil-component>
          <anvil-component type="DropDown" name="standings_scope_picker"></anvil-component>
        </div>
        <div class="field-block">
          <label>Sort by</label>
          <anvil-component type="DropDown" name="standings_sort_by"></anvil-component>
        </div>
      </div>
      <div class="standing-header"><span>Place</span><span>Player</span><span>Division</span><span>Gross</span><span>Net</span></div>
      <anvil-component type="RepeatingPanel" name="standings_rows" prop:item_template="rattler_tournament.StandingRow" prop:role="standing-list"></anvil-component>
      <anvil-component type="Label" name="no_scores_state" prop:role="muted-text"></anvil-component>
    </section>
    <section class="public-leaderboard-section">
      <div class="section-heading">
        <div><p class="eyebrow">SECOND ROUND</p><h3>Pairs</h3></div>
      </div>
      <anvil-component type="RepeatingPanel" name="round_two_pair_rows" prop:item_template="rattler_tournament.PublicRoundTwoPair" prop:role="public-round-two-pair-list"></anvil-component>
      <anvil-component type="Label" name="no_round_two_pairs_state" prop:role="muted-text" prop:text="Second round pairs have not been posted yet."></anvil-component>
    </section>
    <section class="public-leaderboard-section">
      <div class="section-heading">
        <div><p class="eyebrow">TOURNAMENT EXPENSES</p><h3>Expense summary</h3></div>
      </div>
      <div class="public-budget-summary">
        <div><span>Estimated expenses</span><anvil-component type="Label" name="budget_total" prop:text="$0.00"></anvil-component></div>
        <div><span>Paid so far</span><anvil-component type="Label" name="budget_paid" prop:text="$0.00"></anvil-component></div>
        <div><span>Left to cover</span><anvil-component type="Label" name="budget_balance" prop:text="$0.00"></anvil-component></div>
      </div>
      <h4>Participant balances</h4>
      <div class="public-expense-filters">
        <div class="field-block"><label>Search by name</label><anvil-component type="TextBox" name="expense_search" prop:placeholder="Search participants"></anvil-component></div>
        <div class="field-block"><label>Participant type</label><anvil-component type="DropDown" name="expense_participant_type_filter"></anvil-component></div>
        <div class="field-block"><label>Division</label><anvil-component type="DropDown" name="expense_division_filter"></anvil-component></div>
        <div class="field-block"><label>Payment status</label><anvil-component type="DropDown" name="expense_payment_filter"></anvil-component></div>
      </div>
      <anvil-component type="Label" name="expense_filter_status" prop:role="muted-text"></anvil-component>
      <anvil-component type="RepeatingPanel" name="budget_participant_rows" prop:item_template="rattler_tournament.PublicBudgetRow" prop:role="public-budget-participant-list"></anvil-component>
      <anvil-component type="Label" name="no_budget_participants_state" prop:role="muted-text" prop:text="No participant expense details have been added."></anvil-component>
    </section>
  </section>
</anvil-form>
