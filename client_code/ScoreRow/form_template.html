<anvil-form container="ColumnPanel">
  <div class="score-row round-one-score-row">
    <div class="score-player">
      <anvil-component type="Label" name="player_name" prop:role="row-title" bind:text="self.item['entry']['golfer']['name']"></anvil-component>
      <div class="score-input-block">
        <label for="gross_box">Gross score</label>
        <anvil-component type="TextBox" name="gross_box" prop:placeholder="Enter gross score"></anvil-component>
      </div>
    </div>
  </div>
</anvil-form>
