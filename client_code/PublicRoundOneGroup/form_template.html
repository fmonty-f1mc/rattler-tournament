<anvil-form container="ColumnPanel">
  <section class="public-round-one-card">
    <div class="public-round-one-heading">
      <anvil-component type="Label" name="group_label" prop:role="row-title" bind:text="self.item['group_label']"></anvil-component>
      <anvil-component type="Label" name="tee_time" prop:role="muted-text" bind:text="self.item['tee_time']"></anvil-component>
    </div>
    <div class="public-round-one-players">
      <div><span>Player 1</span><div class="public-round-one-player-name"><anvil-component type="Label" name="player_1_name" prop:role="row-title" bind:text="self.item['player_1_name']"></anvil-component><anvil-component type="Label" name="player_1_division_label" prop:role="muted-text" bind:text="self.item['player_1_division_label']"></anvil-component></div><small>Gross · <anvil-component type="Label" name="player_1_score" bind:text="self.item['player_1_score']"></anvil-component></small></div>
      <div><span>Player 2</span><div class="public-round-one-player-name"><anvil-component type="Label" name="player_2_name" prop:role="row-title" bind:text="self.item['player_2_name']"></anvil-component><anvil-component type="Label" name="player_2_division_label" prop:role="muted-text" bind:text="self.item['player_2_division_label']"></anvil-component></div><small>Gross · <anvil-component type="Label" name="player_2_score" bind:text="self.item['player_2_score']"></anvil-component></small></div>
      <div><span>Player 3</span><div class="public-round-one-player-name"><anvil-component type="Label" name="player_3_name" prop:role="row-title" bind:text="self.item['player_3_name']"></anvil-component><anvil-component type="Label" name="player_3_division_label" prop:role="muted-text" bind:text="self.item['player_3_division_label']"></anvil-component></div><small>Gross · <anvil-component type="Label" name="player_3_score" bind:text="self.item['player_3_score']"></anvil-component></small></div>
      <div><span>Player 4</span><div class="public-round-one-player-name"><anvil-component type="Label" name="player_4_name" prop:role="row-title" bind:text="self.item['player_4_name']"></anvil-component><anvil-component type="Label" name="player_4_division_label" prop:role="muted-text" bind:text="self.item['player_4_division_label']"></anvil-component></div><small>Gross · <anvil-component type="Label" name="player_4_score" bind:text="self.item['player_4_score']"></anvil-component></small></div>
    </div>
  </section>
</anvil-form>
