<anvil-form layout="rattler_tournament.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <div class="navigation-context">
      <anvil-component type="Label" name="tournament_selection_label" prop:text="Selected tournament" prop:role="menu-section-label"></anvil-component>
      <anvil-component type="DropDown" name="event_picker"></anvil-component>
    </div>
    <nav class="committee-navigation" aria-label="Committee pages">
      <div class="navigation-group">
        <p class="navigation-group-label">Tournament</p>
        <anvil-component type="Button" name="setup_nav" prop:text="1. Tournament entries" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="field_nav" prop:text="2. Divisions & Rattlercaps" prop:role="tournament-subtab"></anvil-component>
      </div>
      <div class="navigation-group">
        <p class="navigation-group-label">Scores & tee times</p>
        <anvil-component type="Button" name="round_one_nav" prop:text="Round One" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="round_two_nav" prop:text="Round Two" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="standings_nav" prop:text="Standings" prop:role="tournament-subtab"></anvil-component>
      </div>
      <div class="navigation-group">
        <p class="navigation-group-label">Expenses</p>
        <anvil-component type="Button" name="budget_categories_tab_button" prop:text="Expense categories" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="budget_assignments_tab_button" prop:text="Assign expenses" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="budget_payments_tab_button" prop:text="Payments" prop:role="tournament-subtab"></anvil-component>
      </div>
      <div class="navigation-group">
        <p class="navigation-group-label">Communication</p>
        <anvil-component type="Button" name="email_nav" prop:text="Email participants" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="news_nav" prop:text="Publish news" prop:role="tournament-subtab"></anvil-component>
      </div>
      <div class="navigation-group">
        <p class="navigation-group-label">App</p>
        <anvil-component type="Button" name="players_nav" prop:text="Participant directory" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="awards_nav" prop:text="Awards" prop:role="tournament-subtab"></anvil-component>
        <anvil-component type="Button" name="public_view_nav" prop:text="Public view" prop:role="tournament-subtab"></anvil-component>
      </div>
    </nav>
    <div class="navigation-account">
      <anvil-component type="Label" name="current_user_label" prop:role="muted-text"></anvil-component>
      <anvil-component type="Button" name="sign_out_button" prop:text="Sign out" prop:role="secondary-button"></anvil-component>
    </div>
  </anvil-block>
  <anvil-block slot="content">
    <anvil-component type="rattler_tournament.Pages.TournamentDetails" name="tournament_details_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.TournamentField" name="tournament_field_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.RoundOne" name="round_one_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.Standings" name="standings_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.RoundTwo" name="round_two_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.ParticipantDirectory" name="participant_directory_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.Expenses" name="expenses_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.EmailParticipants" name="email_participants_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.NewsEditor" name="news_editor_page"></anvil-component>
    <anvil-component type="rattler_tournament.Pages.Awards" name="awards_page"></anvil-component>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="The Rattler Invitational"></anvil-component>
    <anvil-component type="Label" name="selected_tournament_name" prop:role="h2"></anvil-component>
  </anvil-block>
</anvil-form>
