<anvil-form container="ColumnPanel">
  <div class="player-row">
    <div>
      <anvil-component type="Label" name="name_label" prop:role="row-title" bind:text="self.item['name']"></anvil-component>
      <anvil-component type="Label" name="active_label" prop:role="muted-text"></anvil-component>
    </div>
    <div class="player-edit-field"><label for="email_box">Email</label><anvil-component type="TextBox" name="email_box" prop:placeholder="name@example.com"></anvil-component></div>
    <div class="player-edit-field"><label for="phone_box">Phone</label><anvil-component type="TextBox" name="phone_box" prop:placeholder="Phone number"></anvil-component></div>
    <div class="player-edit-field"><label for="city_box">City</label><anvil-component type="TextBox" name="city_box" prop:placeholder="City"></anvil-component></div>
    <div class="player-edit-field"><label for="state_box">State</label><anvil-component type="TextBox" name="state_box" prop:placeholder="State"></anvil-component></div>
    <div class="player-row-actions">
      <anvil-component type="Button" name="save_button" prop:text="Save details" prop:role="secondary-button"></anvil-component>
      <anvil-component type="Button" name="toggle_button" prop:role="secondary-button"></anvil-component>
      <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role="secondary-button"></anvil-component>
    </div>
  </div>
</anvil-form>
