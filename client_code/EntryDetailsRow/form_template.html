<anvil-form container="ColumnPanel">
  <div class="entry-details-row">
    <div class="field-player">
      <anvil-component type="Label" name="player_label" bind:text="self.item['entry']['golfer']['name']" prop:role="row-title"></anvil-component>
    </div>
    <div class="score-input-block">
      <label>Division</label>
      <anvil-component type="DropDown" name="division_dropdown" writeback:selected_value="self.item['division']"></anvil-component>
    </div>
    <div class="score-input-block">
      <label>Handicap</label>
      <anvil-component type="TextBox" name="handicap_box" writeback:text="self.item['handicap']" prop:placeholder="e.g. 12.4"></anvil-component>
    </div>
  </div>
</anvil-form>
