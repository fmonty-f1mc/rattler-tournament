<anvil-form container="ColumnPanel" prop:role="tracker-view">
  <div class="view-heading">
    <p class="eyebrow">ROUND ONE · TEE TIMES AND SCORES</p>
    <h2>Round one</h2>
    <p class="muted-copy">The generator spreads players across divisions when possible and randomizes the remaining spots. Edit groups or enter gross scores before saving.</p>
  </div>
  <div class="tracker-card">
    <div class="section-heading">
      <div><p class="eyebrow">TEE TIMES</p><h2>Foursomes and score entry</h2></div>
      <div class="round-two-pairing-actions">
        <anvil-component type="Button" name="generate_foursomes_button" prop:text="Generate tee time groups"></anvil-component>
      </div>
    </div>
    <anvil-component type="RepeatingPanel" name="foursome_group_rows" prop:item_template="rattler_tournament.Components.Scoring.FoursomeRow" prop:role="foursome-group-list"></anvil-component>
    <div class="round-one-group-actions">
      <anvil-component type="Button" name="add_foursome_group_button" prop:text="Add Group" prop:role="secondary-button"></anvil-component>
    </div>
    <anvil-component type="Label" name="round_one_status" prop:role="status-text"></anvil-component>
  </div>
</anvil-form>
