<anvil-form container="ColumnPanel" prop:role="tracker-view">
  <div class="tracker-card">
    <div class="section-heading">
      <div><p class="eyebrow">ROSTER</p><h2>Player roster</h2></div>
      <anvil-component type="FlowPanel" name="player_add_options" prop:role="player-add-options">
        <anvil-component type="Button" name="open_individual_player_add_button" prop:text="Add individual" prop:role="secondary-button"></anvil-component>
        <anvil-component type="Button" name="open_bulk_player_add_button" prop:text="Bulk add" prop:role="secondary-button"></anvil-component>
      </anvil-component>
    </div>
    <anvil-component type="ColumnPanel" name="player_create_panel" prop:role="player-add-panel">
      <div class="section-heading"><div><p class="eyebrow">INDIVIDUAL ADD</p><h2>Add one player</h2></div></div>
      <div class="form-grid form-grid-five">
        <div class="field-block"><label>Player name</label><anvil-component type="TextBox" name="player_name" prop:placeholder="Full name"></anvil-component></div>
        <div class="field-block"><label>Email</label><anvil-component type="TextBox" name="player_email" prop:placeholder="name@example.com"></anvil-component></div>
        <div class="field-block"><label>Phone</label><anvil-component type="TextBox" name="player_phone" prop:placeholder="Phone number"></anvil-component></div>
        <div class="field-block"><label>City</label><anvil-component type="TextBox" name="player_city" prop:placeholder="City"></anvil-component></div>
        <div class="field-block"><label>State</label><anvil-component type="TextBox" name="player_state" prop:placeholder="State"></anvil-component></div>
        <div class="field-block"><label>Player handicap (optional)</label><anvil-component type="TextBox" name="player_handicap" prop:placeholder="e.g. 12.4"></anvil-component></div>
      </div>
      <div class="player-add-actions">
        <anvil-component type="Button" name="create_player_button" prop:text="Add to roster"></anvil-component>
        <anvil-component type="Button" name="close_individual_player_add_button" prop:text="Back" prop:role="secondary-button"></anvil-component>
      </div>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="player_import_panel" prop:role="player-add-panel">
      <div class="section-heading"><div><p class="eyebrow">BULK ADD</p><h2>Import from CSV</h2></div></div>
      <p class="muted-copy">Choose a CSV with a <code>name</code> header. Optional headers: <code>email</code>, <code>phone</code>, <code>city</code>, and <code>state</code>. Existing names and rows without a name are skipped.</p>
      <div class="inline-form">
        <anvil-component type="FileLoader" name="player_csv_file" prop:text="Choose CSV" prop:file_types=".csv"></anvil-component>
      </div>
      <div class="player-add-actions">
        <anvil-component type="Button" name="import_players_button" prop:text="Import players" prop:role="secondary-button"></anvil-component>
        <anvil-component type="Button" name="close_bulk_player_add_button" prop:text="Back" prop:role="secondary-button"></anvil-component>
      </div>
    </anvil-component>
    <anvil-component type="Label" name="player_status" prop:role="status-text"></anvil-component>
    <div class="player-roster-filters">
      <div class="field-block"><label>Search participants</label><anvil-component type="TextBox" name="player_search" prop:placeholder="Search name, email, or phone"></anvil-component></div>
      <anvil-component type="CheckBox" name="email_unlisted_filter" prop:text="Email unlisted" prop:role="player-contact-filter"></anvil-component>
      <anvil-component type="CheckBox" name="phone_unlisted_filter" prop:text="Phone unlisted" prop:role="player-contact-filter"></anvil-component>
    </div>
    <anvil-component type="Label" name="player_filter_status" prop:role="muted-text"></anvil-component>
    <anvil-component type="RepeatingPanel" name="player_rows" prop:item_template="rattler_tournament.Components.Participants.PlayerRow" prop:role="player-list"></anvil-component>
    <anvil-component type="Label" name="no_player_matches" prop:role="muted-text"></anvil-component>
  </div>
</anvil-form>
